<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/form.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
<body>

<div class="container min-vh-100 d-flex justify-content-center align-items-center">
  <div class="card shadow-lg border-0 rounded-4 w-100 text-light" style="max-width: 650px; background: linear-gradient(135deg, #1a1a1a 0%, #2c2c2c 50%, #0d0d0d 100%);">
    <div class="card-body p-4 p-md-5">
      <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
        <a href="index.html" class="text-decoration-none text-light fs-5">
          <i class="fa-solid fa-angles-left"></i>
        </a>
        <a href="cv.html" class="text-decoration-none fw-semibold text-light">CV</a>
      </header>
      <h1 class="text-center fw-bold mb-5 text-light">Contattami</h1>
      <form id="mailForm">
        <div class="mb-4">
          <label for="name" class="form-label fw-semibold text-light">Name</label>
          <input type="text" id="name" class="form-control form-control-lg rounded-3 bg-dark text-light border-secondary" placeholder="Nome">
        </div>
        <div class="mb-4">
          <label for="email" class="form-label fw-semibold text-light">Email</label>
          <input type="email" id="email" class="form-control form-control-lg rounded-3 bg-dark text-light border-secondary" placeholder="Indirizzo Email">
        </div>
        <div class="mb-4">
          <label for="message" class="form-label fw-semibold text-light">Message</label>
          <textarea id="message" class="form-control form-control-lg rounded-3 bg-dark text-light border-secondary" rows="6" placeholder="Il tuo messaggio..."></textarea>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-lg rounded-3 btn-outline-warning">Invia</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
</script>

<script type="text/javascript">
   (function(){
      emailjs.init({
        publicKey: "FCsDKA30sOtYYRZKG",
      });
   })();
</script>

<script src="mail.js"></script>

</body>
</html>
